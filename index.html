<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030d16">
    <meta name="color-scheme" content="dark">
    <title>AmaiSharkyuu's Bio</title>
    <link rel="stylesheet" href="aero.css">
    <style>
        /* ---- Éléments propres à la page d'accueil ---- */

        .title-panel {
            text-align: center;
            padding: 20px 18px;
        }

        .title-panel .page-title span {
            position: relative;
            display: inline-block;
        }

        .title-blahaj {
            width: 52px;
            height: auto;
            position: absolute;
            left: -62px;
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
            -webkit-user-select: none;
            filter: drop-shadow(0 0 10px rgba(79, 216, 255, 0.6));
        }

        .avatar-wrap {
            display: flex;
            justify-content: center;
        }

        .avatar {
            width: 148px;
            height: 148px;
            object-fit: cover;
            background-color: rgba(3, 20, 32, 0.8);
            border: 1px solid var(--glass-line);
            border-top: 2px solid var(--glass-top);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.6),
                0 0 22px rgba(79, 216, 255, 0.25);
        }

        /* Boîte bio : le GIF de bulles reste, mais assombri pour rester lisible */
        .bio-panel {
            text-align: center;
            background-image:
                linear-gradient(rgba(3, 16, 26, 0.78), rgba(3, 16, 26, 0.86)),
                url('bubble-pixel-background.gif');
            background-size: cover;
            background-position: center;
        }

        .bio-panel h2 {
            margin: 0 0 14px;
            font-size: 23px;
            font-weight: 700;
            color: var(--pink);
            text-shadow: 0 0 14px rgba(255, 122, 209, 0.55);
        }

        .line {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 9px;
            color: var(--text);
        }
        .line:last-child { margin-bottom: 0; }

        .bubble-bio-bottom {
            bottom: -24px;
            right: -20px;
            width: 52px;
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="panel title-panel" data-accent="aqua">
            <h1 class="page-title">
                AmaiSharkyuu's<br>
                <span>
                    <img class="title-blahaj" src="Roblox_blahaj.webp" alt="Roblox Blahaj" draggable="false">
                    Bio
                </span>
            </h1>
        </header>

        <div class="avatar-wrap">
            <!-- avatar.png est rafraîchi chaque jour par .github/workflows/avatar.yml -->
            <img class="avatar" src="avatar.png" width="420" height="420" alt="Avatar Roblox d'AmaiSharkyuu" draggable="false">
        </div>

        <div class="panel bio-panel" data-accent="pink">
            <h2>AmaiSharkyuu</h2>
            <div class="line">🎂 23/12/2009</div>
            <div class="line">💬 Pronouns : Any</div>
            <div class="line">🏳️‍⚧️ Trans Girl, lesbian</div>
            <div class="line">♾️ Autistic</div>

            <img src="bubble-tadc.gif" class="sticker bubble-bio-bottom" alt="Bubble Sticker" draggable="false">
        </div>

        <a class="aero-button" data-style="red" href="Characters/">
            ⭐ My Favorite Characters
        </a>

        <a class="aero-button" data-style="violet" href="Interests/">
            ✨ Interests
        </a>

        <a class="aero-button" data-style="steel" href="HateList/">
            ❌ People I HATE
        </a>

    </div>

    <footer class="site-footer">
        <a href="mentions-legales.html">Mentions légales</a>
    </footer>

</body>
</html>
