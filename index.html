<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030d16">
    <meta name="color-scheme" content="dark">
    <title>AmaiSharkyuu's space</title>
    <meta name="description" content="AmaiSharkyuu's personal corner of the web. Minecraft, JoJo, sharks and a pile of small websites.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="aero.css">
    <style>
        .hero {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .avatar {
            width: 132px;
            height: 132px;
            flex: 0 0 auto;
            object-fit: cover;
            background-color: rgba(3, 20, 32, 0.8);
            border: 1px solid var(--glass-line);
            border-top: 2px solid var(--glass-top);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.6),
                0 0 22px rgba(79, 216, 255, 0.25);
        }

        .facts {
            flex: 1 1 190px;
            min-width: 0;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .facts li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 7px;
        }
        .facts li:last-child { margin-bottom: 0; }

        .bubble-sticker {
            bottom: -22px;
            right: -16px;
            width: 50px;
        }
    </style>
</head>
<body>

<div class="page">

    <header class="site-head">
        <h1 class="site-title">AmaiSharkyuu's space</h1>
    </header>

    <nav class="nav-col navbar panel" data-accent="aqua" aria-label="Site navigation" data-site="nav"></nav>

    <main class="main-col">

        <section class="panel" data-accent="pink">
            <h2 class="panel-title"><span class="pxi pink pxi-chat" aria-hidden="true"></span>Hi!!!</h2>

            <div class="section-wrapper">
                <p>Hi, this is my site!</p>
                <p>I put everything I make and everything I like here.</p>
                <p>Navbar's on the right, click around. The sites I made are in <a href="mysites/">My sites</a>.</p>

                <img src="bubble-tadc.gif" class="sticker bubble-sticker" alt="" draggable="false">
            </div>
        </section>

        <section class="panel" data-accent="aqua">
            <h2 class="panel-title"><span class="pxi pxi-person" aria-hidden="true"></span>AmaiSharkyuu</h2>

            <div class="hero">
                <!-- avatar.png est rafraîchi chaque jour par .github/workflows/avatar.yml -->
                <img class="avatar" src="avatar.png" width="420" height="420" alt="AmaiSharkyuu's Roblox avatar" draggable="false">

                <ul class="facts" data-site="facts"></ul>
            </div>

            <hr class="aero-sep">

            <p class="muted">More about me in <a href="about/">About me</a>. Please read the <a href="HateList/">DNI list</a> before you interact.</p>
        </section>

    </main>

    <footer class="site-footer" data-site="footer"></footer>

</div>

<script src="site.js"></script>
</body>
</html>
