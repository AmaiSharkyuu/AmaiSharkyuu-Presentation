<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030d16">
    <meta name="color-scheme" content="dark">
    <title>DNI list — AmaiSharkyuu</title>
    <meta name="description" content="Do not interact list. Read it before saying hi.">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../aero.css">
    <style>
        .bubble.tint-warn {
            background-color: rgba(52, 12, 20, 0.6);
            border-color: rgba(255, 107, 107, 0.35);
        }
        .bubble.tint-warn li { font-weight: 700; }

        .section-title.warn { color: var(--ruby); text-shadow: 0 0 12px rgba(255, 107, 107, 0.4); }

        /* Ces deux GIF ont un fond opaque clair : sur fond sombre ils
           formaient un carré blanc bizarre. On les encadre pour que ça
           ressemble à une petite photo posée, pas à un bug d'affichage. */
        .stk-emoji,
        .stk-cat {
            padding: 3px;
            background-color: rgba(3, 20, 32, 0.85);
            border: 1px solid var(--glass-line);
            border-top: 1px solid rgba(168, 240, 255, 0.5);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
        }

        .stk-emoji { top: -20px; right: -14px; width: 48px; }
        .stk-cat   { bottom: -22px; left: -20px; width: 58px; }
    </style>
</head>
<body>

<div class="page">

    <header class="site-head">
        <h1 class="site-title">DNI list</h1>
    </header>

    <nav class="nav-col navbar panel" data-accent="aqua" aria-label="Site navigation" data-site="nav"></nav>

    <main class="main-col">

        <section class="panel" data-accent="ruby">
            <h2 class="panel-title"><span class="pxi pxi-cross" aria-hidden="true"></span>DNI list</h2>

            <p>Short list, but I mean every line of it. If any of this is you, please don't interact with me.</p>

            <div class="section-wrapper">
                <h3 class="section-title warn">Do not interact if you are</h3>

                <img src="../assets/cat-emoji.gif" alt="" class="sticker stk-emoji" draggable="false" loading="lazy">

                <div class="bubble scroll-lg tint-warn">
                    <ul>
                        <li>Basic stuff: pdfiles, homophobes, racists, transphobes</li>
                        <li>Toxic people</li>
                        <li>People who do illegal things</li>
                    </ul>
                </div>

                <img src="../assets/cat-scuba.gif" alt="" class="sticker stk-cat" draggable="false" loading="lazy">
            </div>

            <hr class="aero-sep">

            <p class="muted">Everyone else: hi, you're welcome here.</p>
        </section>

    </main>

    <footer class="site-footer" data-site="footer"></footer>

</div>

<script src="../site.js"></script>
</body>
</html>
