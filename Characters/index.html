<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030d16">
    <meta name="color-scheme" content="dark">
    <title>Characters - AmaiSharkyuu</title>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../aero.css">
    <style>
        /* ---- Éléments propres à la page Characters ---- */

        .page-header h1 {
            font-family: 'Darumadrop One', cursive, sans-serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--ruby);
            text-shadow: 0 0 14px rgba(255, 107, 107, 0.5);
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .char-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Le petit cadre vitré autour de chaque portrait */
        .char-square {
            width: 100%;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            padding: 4px;
            overflow: hidden;

            background-color: rgba(3, 20, 32, 0.8);
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.25));
            border: 1px solid var(--glass-line);
            border-top: 1px solid rgba(168, 240, 255, 0.5);
            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .char-square:active {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), 0 0 18px rgba(79, 216, 255, 0.4);
        }

        @media (hover: hover) {
            .char-square:hover {
                transform: scale(1.04);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), 0 0 18px rgba(79, 216, 255, 0.4);
            }
        }

        .char-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        .char-name {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-dim);
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="panel" data-accent="pink">

            <header class="page-header">
                <h1>⭐ Characters</h1>
                <a href="../" class="aero-button back-btn" data-style="steel">⬅️ Back</a>
            </header>

            <div class="characters-grid">

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/Jax TADC icon.webp" alt="Jax" draggable="false">
                    </div>
                    <p class="char-name">Jax (TADC)</p>
                </div>

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/🧼🫧.webp" alt="Bubble" draggable="false">
                    </div>
                    <p class="char-name">Bubble (TADC)</p>
                </div>

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/Rick_Sanchez.webp" alt="Rick Sanchez" draggable="false">
                    </div>
                    <p class="char-name">Rick (Rick & Morty)</p>
                </div>

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/Kinger.webp" alt="Kinger" draggable="false">
                    </div>
                    <p class="char-name">Kinger (TADC)</p>
                </div>

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/Jodio.webp" alt="Jodio" draggable="false">
                    </div>
                    <p class="char-name">Jodio (JoJoLands)</p>
                </div>

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/★Dragona Joestar★.jpg" alt="Dragona Joestar" draggable="false">
                    </div>
                    <p class="char-name">Dragona (JoJoLands)</p>
                </div>

                <div class="char-item">
                    <div class="char-square">
                        <img src="Images/Verity.webp" alt="Verity" draggable="false">
                    </div>
                    <p class="char-name">Verity (ThatMob)</p>
                </div>

            </div>

        </div>

    </div>

    <footer class="site-footer">
        <a href="../mentions-legales.html">Mentions légales</a>
    </footer>

</body>
</html>
